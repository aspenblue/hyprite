---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Hyprland repository
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - lionheartp/Hyprland


  # -----------------------------------------------
  # Diagnostics
  # -----------------------------------------------

  - type: script
    snippets:
      - |
        set -eux

        echo "========================================"
        echo "DNF repositories"
        echo "========================================"
        dnf5 repolist

        echo
        echo "========================================"
        echo "Hyprland package"
        echo "========================================"
        dnf5 repoquery --info hyprland || true

        echo
        echo "========================================"
        echo "Hyprland Requires"
        echo "========================================"
        dnf5 repoquery --requires hyprland || true

        echo
        echo "========================================"
        echo "Hyprland Recommends"
        echo "========================================"
        dnf5 repoquery --recommends hyprland || true

        echo
        echo "========================================"
        echo "Hyprland Suggests"
        echo "========================================"
        dnf5 repoquery --suggests hyprland || true

        echo
        echo "========================================"
        echo "Anything requiring Kitty"
        echo "========================================"
        dnf5 repoquery --whatrequires kitty || true

        echo
        echo "========================================"
        echo "Kitty package"
        echo "========================================"
        dnf5 repoquery --info kitty || true


  # -----------------------------------------------
  # Hyprland packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # Hyprland
        - hyprland
        - hyprpaper
        - hyprpicker
        - hypridle
        - hyprlock
        - hyprpolkitagent
        - hyprland-guiutils

        # Hyprland portals
        # - xdg-desktop-portal          # installed in base-main
        - xdg-desktop-portal-hyprland
        # - xdg-desktop-portal-gtk      # installed in base-main    
