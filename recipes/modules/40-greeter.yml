---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Greeter packages
  # -----------------------------------------------

  - type: dnf
    install:
      packages:
        # Login / greeter
        - greetd
      options:
        - --setopt=install_weak_deps=False


  # -----------------------------------------------
  # Enable greetd
  # -----------------------------------------------

  - type: systemd
    system:
      enabled:
        - greetd.service
