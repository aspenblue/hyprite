---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Elementary repository
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - garaevdi/pantheon-rpm  


  # -----------------------------------------------
  # Desktop packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:

        # Basic
        - elementary-files              # Файлы
        - elementary-files-portal
        # -                               # Архивы

        # Code
        - elementary.code               # Редактор кода

        # Tools        
        # -                               # Шрифты
        # -                               # RDP
        - gucharmap                     # Символы
        - gparted                       # Разметка дисков
        # -                               # Использование диска         
        - btrfs-assistant               # Snapper
        - dmenu-wayland
      

  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:

          # Basic
          # -                               # Блокнот
          # -                               # Часы и будильник

          # Media
          - io.bassi.Amberol              # Музыка

          # Office
          # -                               # PDF, DJVu
          - org.onlyoffice.desktopeditors # Офис

          # Web
          - org.pvermeer.WebAppHub        # Веб-приложения
          - org.mozilla.firefox           # Браузер
          - com.getmailspring.Mailspring  # Почта

          # Apps
          - io.github.kolunmi.Bazaar      # Магазин приложений

  
  # -----------------------------------------------
  # Elementary flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        repo:
          url: https://flatpak.elementary.io/repo.flatpakrepo
          name: elementary
          title: elementary AppCenter
        install:

          # Basic
          - io.elementary.calculator//stable      # Калькулятор
          - io.elementary.calendar//stable        # Календарь
          - io.elementary.tasks//stable           # Задачи
          - io.elementary.iconbrowser//stable     # Иконки
          - io.elementary.maps//stable            # Карты

          # Media
          - io.elementary.photos//stable          # Изображения
          - io.elementary.videos//stable          # Видео
          - io.elementary.camera//stable          # Камера
          - io.elementary.music//stable           # Музыка

          # Web
          - io.elementary.mail//stable            # Почта
          - io.elementary.capnet-assist//stable   # Помощник авторизации wifi
