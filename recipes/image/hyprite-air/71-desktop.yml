---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Desktop packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:

        # Basic
        - elementary-files          # Файлы
        # -                           # Архивы
        - elementary-calculator     # Калькулятор
        - elementary-calendar       # Календарь
        - elementary-code           # Блокнот
        # -                         # Часы и будильник

        # Media
        - elementary-photos         # Изображения
        - elementary-videos         # Видео
        - elementary-camera         # Камера

        # Office
        # -                           # PDF, DJVu

        # Web
        - webapp-manager            # Веб-приложения

        # Tools
        - gucharmap                 # Символы
        - elementary-fonts          # Шрифты
        # -                           # RDP
        - gparted                   # Разметка дисков
        # -                           # Использование диска         
        - btrfs-assistant           # Snapper
      

  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:

          # Media
          - io.bassi.Amberol              # Музыка

          # Office
          - org.onlyoffice.desktopeditors # Офис

          # Web
          - org.mozilla.firefox           # Браузер
          - com.getmailspring.Mailspring  # Почта

          # Apps
          - io.github.kolunmi.Bazaar      # Магазин приложений
