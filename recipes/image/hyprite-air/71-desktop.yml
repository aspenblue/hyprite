---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Elementary repository
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - garaevdi/pantheon-rpm


  # -----------------------------------------------
  # Elementary flatpak repository
  # -----------------------------------------------

  - type: default-flatpaks
    configurations:
      - scope: system
        repo:
          url: https://flatpak.elementary.io/repo.flatpakrepo
          name: elementary
          title: elementary AppCenter    


  # -----------------------------------------------
  # Desktop packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:

        # Basic
        - elementary-files          # Файлы
        - elementary-files-portal
        # -                           # Архивы

        # Tools        
        # -                           # Шрифты
        # -                           # RDP
        - gucharmap                 # Символы
        - gparted                   # Разметка дисков
        # -                           # Использование диска         
        - btrfs-assistant           # Snapper
        - dmenu-wayland
      

  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:

          # Basic
          - io.elementary.calculator      # Калькулятор
          - io.elementary.code            # Блокнот
          # -                             # Часы и будильник
          - io.elementary.calendar        # Календарь

          # Media
          - io.elementary.photos          # Изображения
          - io.elementary.videos          # Видео
          - io.elementary.camera          # Камера
          - io.elementary.music           # Музыка
          - io.bassi.Amberol              # Музыка

          # Office
          # -                               # PDF, DJVu
          - org.onlyoffice.desktopeditors # Офис

          # Web
          - org.pvermeer.WebAppHub        # Веб-приложения
          - org.mozilla.firefox           # Браузер
          - io.elementary.mail            # Почта
          - com.getmailspring.Mailspring  # Почта

          # Apps
          - io.github.kolunmi.Bazaar      # Магазин приложений
