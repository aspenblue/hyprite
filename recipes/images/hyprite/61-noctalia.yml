---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # Terra repository
  # -----------------------------------------------

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo  


  # -----------------------------------------------
  # Noctalia packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        # Noctalia
        - noctalia         

  # -----------------------------------------------
  # Noctalia - configuration
  # -----------------------------------------------

  - type: files
    files:
      - source: dotfiles/noctalia
        destination: /  

  
  # -----------------------------------------------
  # Noctalia - reset configuration
  # -----------------------------------------------

  - type: script
    scripts:
      - noctalia-user-config.sh
