---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # WebApp-manager repository
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - refi64/webapp-manager


  # -----------------------------------------------
  # Desktop packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:

        # Tools
        - gnome-disk-utility        # Разметка дисков
        - btrfs-assistant           # Snapper
      

  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:

          # Basic
          - org.gnome.Nautilus            # Файлы
          - org.gnome.FileRoller          # Архивы
          - org.gnome.Calculator          # Калькулятор
          - org.gnome.TextEditor          # Блокнот
          - org.gnome.clocks              # Часы и будильник

          # Media
          - io.bassi.Amberol              # Музыка
          - org.gnome.Loupe               # Изображения
          - org.gnome.Showtime            # Видео
          - org.gnome.Snapshot            # Камера

          # Office
          - org.gnome.Papers              # PDF, DJVu
          - org.onlyoffice.desktopeditors # Офис

          # Web
          - org.mozilla.firefox           # Браузер
          - com.getmailspring.Mailspring  # Почта
          - org.pvermeer.WebAppHub        # Веб-приложения

          # Apps
          - io.github.kolunmi.Bazaar      # Магазин приложений

          # Tools
          - org.gnome.Characters          # Символы
          - org.gnome.font-viewer         # Шрифты
          - org.gnome.Connections         # RDP
          - org.gnome.baobab              # Использование диска   
