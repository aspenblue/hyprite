---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json

modules:

  # -----------------------------------------------
  # WebApp-manager repository
  # -----------------------------------------------

  - type: dnf
    repos:
      copr:
        - refi64/webapp-manager


  # -----------------------------------------------
  # Desktop packages
  # -----------------------------------------------

  - type: dnf
    install:
      install-weak-deps: false
      packages:
        - thunar
        - webapp-manager
        - gparted
      

  # -----------------------------------------------
  # Desktop flatpaks
  # -----------------------------------------------      

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:

          # Basic
          - org.gnome.Calculator
          - org.gnome.Calendar
          - org.gnome.Papers
          - org.gnome.clocks

          # Media
          - org.gnome.Showtime
          - org.gnome.Loupe
          - org.gnome.Snapshot
          - io.bassi.Amberol

          # Web
          - org.mozilla.firefox
          - com.getmailspring.Mailspring

          # Apps
          - io.github.kolunmi.Bazaar
          
          # Tools
          - org.gnome.Connections
          - org.gnome.Characters
          - org.gnome.FileRoller
          - org.gnome.font-viewer
          - io.gitlab.adhami3310.Impression
