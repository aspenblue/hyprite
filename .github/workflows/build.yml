name: Build Hyprite

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  packages: write

jobs:

  build:

    strategy:
      matrix:
        recipe:
          - hyprite
          - hyprite-air

    name: Build ${{ matrix.recipe }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:

      # Основной репозиторий
      - name: Checkout Hyprite
        uses: actions/checkout@v7

      # Общий репозиторий
      - name: Checkout Common
        uses: actions/checkout@v7
        with:
          repository: aspenblue/common
          ref: main
          path: tmp/common

      # Кладём общие recipes туда, где BlueBuild их ожидает
      - name: Install common recipes
        run: |
          cp -a tmp/common/recipes/* recipes/

      # Кладём общие files
      - name: Install common files
        run: |
          cp -a tmp/common/files/* files/

      - name: Build image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }}.yml
          skip_checkout: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          maximize_build_space: true
